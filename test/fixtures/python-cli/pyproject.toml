[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cli-fixture"
version = "0.1.0"
description = "Test fixture for ACS v5.0"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mycli = "cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
